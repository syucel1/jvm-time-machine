name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Commits made on Windows can lose the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Builds all modules, records demo.jfr and runs the tests (Phase 2 exit gate).
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Summarise demo.jfr
        run: |
          ./gradlew :tm-cli:run --no-daemon -q --args="summary demo/build/jfr/demo.jfr" | tee summary.txt
          {
            echo "### demo.jfr summary"
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload demo.jfr
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-jfr
          path: demo/build/jfr/demo.jfr
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
